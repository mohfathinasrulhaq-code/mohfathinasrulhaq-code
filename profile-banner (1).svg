<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1526"/>
      <stop offset="1" stop-color="#0d0b13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#7ee8c7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b6b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="photo"><circle cx="135" cy="125" r="78"/></clipPath>
    <clipPath id="card"><rect width="850" height="250" rx="22"/></clipPath>
  </defs>

  <!-- Kartu -->
  <rect width="850" height="250" rx="22" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="848.5" height="248.5" rx="21.5" fill="none" stroke="#2c2340" stroke-width="1.5"/>

  <!-- Dekorasi cahaya -->
  <g clip-path="url(#card)">
    <circle cx="135" cy="125" r="170" fill="url(#glow)"/>
    <circle cx="800" cy="20" r="120" fill="#7ee8c7" opacity="0.06"/>
    <circle cx="830" cy="240" r="90" fill="#ffb347" opacity="0.07"/>
  </g>

  <!-- Titik-titik dekorasi kanan atas -->
  <g fill="#3a2f52">
    <circle cx="770" cy="30" r="2.5"/><circle cx="785" cy="30" r="2.5"/><circle cx="800" cy="30" r="2.5"/>
    <circle cx="770" cy="45" r="2.5"/><circle cx="785" cy="45" r="2.5"/><circle cx="800" cy="45" r="2.5"/>
  </g>

  <!-- Foto bulat dengan cincin gradasi -->
  <circle cx="135" cy="125" r="88" fill="none" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="135" cy="125" r="78" fill="#241c33"/>
  <!-- GANTI: tempel base64 foto menggantikan PASTE_BASE64_DI_SINI -->
  <image href="data:image/jpeg;base64,PASTE_BASE64_DI_SINI" x="57" y="47" width="156" height="156" preserveAspectRatio="xMidYMid slice" clip-path="url(#photo)"/>

  <!-- Pil status -->
  <rect x="265" y="34" width="190" height="26" rx="13" fill="#7ee8c7" fill-opacity="0.12" stroke="#7ee8c7" stroke-opacity="0.5"/>
  <circle cx="282" cy="47" r="4" fill="#7ee8c7"/>
  <!-- GANTI: status -->
  <text x="294" y="51" font-family="'Segoe UI', 'Poppins', sans-serif" font-size="12" font-weight="600" fill="#7ee8c7">Terbuka untuk proyek</text>

  <!-- GANTI: nama -->
  <text x="263" y="115" font-family="'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="url(#accent)">Nama Kamu</text>

  <!-- GANTI: peran -->
  <text x="265" y="145" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#e8e1f0">Fullstack Developer &#183; Software Engineer</text>

  <!-- GANTI: deskripsi singkat -->
  <text x="265" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#9a8fb0">Membangun aplikasi web yang cepat, rapi, dan mudah dirawat.</text>

  <!-- GANTI: tag pil (sesuaikan lebar) -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="11.5" font-weight="600" text-anchor="middle">
    <rect x="265" y="190" width="92" height="28" rx="14" fill="#2a2140" stroke="#ff6b6b" stroke-opacity="0.6"/>
    <text x="311" y="208" fill="#ffd0c4">Backend</text>

    <rect x="367" y="190" width="100" height="28" rx="14" fill="#2a2140" stroke="#ffb347" stroke-opacity="0.6"/>
    <text x="417" y="208" fill="#ffe2b8">Frontend</text>

    <rect x="477" y="190" width="92" height="28" rx="14" fill="#2a2140" stroke="#7ee8c7" stroke-opacity="0.6"/>
    <text x="523" y="208" fill="#c8f5e8">DevOps</text>
  </g>

  <!-- GANTI: lokasi -->
  <text x="835" y="232" font-family="'Fira Code', 'Courier New', monospace" font-size="10.5" fill="#6d6285" text-anchor="end">&#128205; Kota, Indonesia  &#183;  GMT+7</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
