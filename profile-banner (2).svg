  <rect x="260" y="38" width="8" height="8" fill="#7ee8c7"/>
  <!-- GANTI: status -->
  <text x="278" y="46" font-family="'Fira Code','Courier New',monospace" font-size="11" font-weight="700" fill="#7ee8c7" letter-spacing="0.5">STATUS: OPEN TO WORK</text>

