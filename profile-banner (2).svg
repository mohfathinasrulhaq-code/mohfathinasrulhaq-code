  <rect x="283" y="0" width="284" height="6" fill="#ffb347"/>
  <rect x="567" y="0" width="283" height="6" fill="#7ee8c7"/>

  <!-- Garis aksen kanan -->
  <rect x="844" y="6" width="6" height="244" fill="#ffb347"/>

  <!-- Frame foto kiri (persegi) -->
  <rect x="30" y="34" width="184" height="184" fill="#241c33" stroke="#3a2f52" stroke-width="1"/>
