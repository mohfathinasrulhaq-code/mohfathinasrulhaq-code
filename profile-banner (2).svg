  <text x="250" y="232" font-family="'Fira Code','Courier New',monospace" font-size="10.5" fill="#8a7fa3" letter-spacing="0.6">KOTA, INDONESIA  |  GMT+7  |  STACK: TS - GO - PYTHON</text>
