<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>

  <!-- Latar persegi panjang -->
